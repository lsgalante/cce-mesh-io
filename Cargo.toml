[package]
name = "cce-mesh-io"
version = "0.1.0"
edition = "2021"
description = "Mesh files in and out for cce apps: STL, OBJ, glTF and PLY read into one scene type"

[lib]
name = "cce_mesh_io"
path = "src/lib.rs"

[dependencies]
# Byte-safe percent_decode (fmt); GUI-free, without the config.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", default-features = false }
glam = "0.29"
log = "0.4"
# Without its default `import` feature: that pulls in the image decoders for
# textures nothing here draws yet. Buffers are loaded by hand (`gltf.rs`).
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
base64 = "0.22"
# Texture images: what glTF and MTL files name (PNG and JPEG are the two the
# glTF spec allows).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
